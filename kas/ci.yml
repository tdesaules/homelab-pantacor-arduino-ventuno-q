header:
  version: 16
local_conf_header:
  # KAS writes these blocks in key order; this must follow base's prototype.
  zz_hosted_ci: |
    BB_NUMBER_THREADS = "2"
    PARALLEL_MAKE = "-j 2"
    INHERIT += "ventuno-ci"
    SSTATE_DIR = "${TOPDIR}/sstate-cache"
    BB_DISKMON_DIRS = "STOPTASKS,${TMPDIR},1G,100K HALT,${TMPDIR},512M,50K"
